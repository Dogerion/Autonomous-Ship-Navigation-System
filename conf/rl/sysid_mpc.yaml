# Two-stage controller — GRU System-ID network + receding-horizon MPC
# Used by src/agents/mpc_manager.py

# System Identification Neural Network
sysid:
  history_length: 10         # Length of the rolling [yaw_rate, rudder] window fed to the GRU
  hidden_sizes: [32, 16]     # [GRU hidden size, following linear layer size] of SysIDNet
  learning_rate: 0.001       # Adam step size for supervised training of the GRU
  epochs: 50                 # Number of passes over the collected dataset
  log_interval: 10           # Print MSE loss to console every N epochs (TensorBoard logs every epoch)
  excitation_steps: 50000    # Random-rudder env steps used to collect (history -> K,T) training samples; more steps = broader coverage of the randomized K/T space

# Model Predictive Controller
mpc:
  prediction_horizon: 20     # Number of steps the controller optimizes ahead on each solve (N)

# Evaluation settings (mode=eval)
eval:
  n_eval_episodes: 20        # Episodes averaged to report mean/std reward
