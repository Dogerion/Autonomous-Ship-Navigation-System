# RNN PPO hyperparameters training settings
learning_rate: 0.0003
n_steps: 128                # Lowered for fast trial
batch_size: 64              # Must be a factor of n_steps (128 % 64 = 0)
n_epochs: 3                 # Lowered for fast trial
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.0
total_timesteps: 512        # Only do a few PPO rollouts (e.g. 512 / 128 = 4 updates)
log_interval: 10

# Evaluation settings
eval:
  n_eval_episodes: 2

# Hyperparameter Optimization Parameters
hpo:
  n_trials: 2               # Just run 2 trials to test the pipeline
  n_eval_episodes: 3        # Number of episodes to run during evaluation checks inside HPO sweeps
  learning_rate_min: 1e-5
  learning_rate_max: 1e-3
  gamma_min: 0.90
  gamma_max: 0.9999
