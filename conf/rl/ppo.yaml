# RecurrentPPO (LSTM policy) hyperparameters — used by src/agents/ppo_manager.py

learning_rate: 0.0003      # Adam step size for the policy and value networks
n_envs: 8                  # Parallel environments collected per rollout step -- the main wall-clock
                            # lever (batches the LSTM forward pass across envs); also adds more
                            # diverse ships (K/T) per update. Raise if CPU headroom allows.
n_steps: 2048              # Env steps collected per update PER ENV (rollout-buffer size = n_steps * n_envs)
batch_size: 32             # Minibatch size for the gradient updates; must divide n_steps * n_envs (2048*8 % 32 == 0)
n_epochs: 10               # Number of optimization passes over each rollout buffer per update
gamma: 0.99                # Reward discount factor — how much future reward is valued vs immediate
gae_lambda: 0.95           # GAE smoothing for advantage estimation (→1 lower bias/higher variance, →0 the reverse)
clip_range: 0.2            # PPO clip limiting how far the policy may shift in a single update
ent_coef: 0.001            # Entropy-bonus weight; keeps action std from collapsing too early so the
                            # policy keeps exploring past a mediocre local optimum (0 = no bonus)
total_timesteps: 500000    # Total env steps to train for
log_interval: 1            # Dump metrics to TensorBoard every N updates; keep <= total_timesteps / n_steps

# Evaluation settings (mode=eval)
eval:
  n_eval_episodes: 20      # Episodes averaged to report mean/std reward

# Optuna hyperparameter search (mode=optimize)
hpo:
  n_trials: 20             # Number of hyperparameter sets to sample and evaluate
  n_eval_episodes: 10      # Episodes used to score each trial
  learning_rate_min: 1e-5  # Lower bound of the learning-rate search (log-uniform)
  learning_rate_max: 1e-3  # Upper bound of the learning-rate search (log-uniform)
  gamma_min: 0.90          # Lower bound of the discount-factor search
  gamma_max: 0.9999        # Upper bound of the discount-factor search
